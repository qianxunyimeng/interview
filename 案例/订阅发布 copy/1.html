<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高级PubSub消息系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div class="container">
    <!-- 头部 -->
    <header>
      <h1><i class="fas fa-exchange-alt"></i> 高级PubSub消息系统</h1>
      <p class="subtitle">支持消息广播、历史回放、ACK确认、单播多播模式的强大发布-订阅系统</p>
      <div class="feature-badges">
        <div class="badge"><i class="fas fa-broadcast-tower"></i> 单播/多播</div>
        <div class="badge"><i class="fas fa-history"></i> 历史回放</div>
        <div class="badge"><i class="fas fa-check-circle"></i> ACK确认</div>
        <div class="badge"><i class="fas fa-clock"></i> 超时处理</div>
      </div>
    </header>

    <!-- 主控制台 -->
    <div class="dashboard">
      <!-- 发布控制台 -->
      <div class="card">
        <div class="card-header">
          <h2><i class="fas fa-paper-plane"></i> 消息发布</h2>
        </div>
        <div class="form-group">
          <label><i class="fas fa-hashtag"></i> 主题名称</label>
          <input type="text" id="publishTopic" value="news.sports">
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> 消息内容</label>
          <textarea id="messageContent">NBA总决赛最新动态！</textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-broadcast-tower"></i> 广播模式</label>
          <select id="broadcastMode">
            <option value="multicast">多播</option>
            <option value="unicast">单播</option>
            <option value="limited">限制消费</option>
          </select>
        </div>
        <div class="form-group" id="maxConsumptionGroup" style="display: none;">
          <label><i class="fas fa-user-friends"></i> 最大消费次数</label>
          <input type="number" id="maxConsumption" value="3" min="1">
        </div>
        <div class="actions">
          <button id="publishBtn" class="primary"><i class="fas fa-paper-plane"></i> 发布消息</button>
          <button id="publishNoSubBtn" class="warning"><i class="fas fa-user-slash"></i> 无订阅测试</button>
        </div>
        <h3><i class="fas fa-clipboard-list"></i> 发布日志</h3>
        <div class="logs" id="publishLog"></div>
      </div>

      <!-- 订阅控制台 -->
      <div class="card">
        <div class="card-header">
          <h2><i class="fas fa-inbox"></i> 消息订阅</h2>
        </div>
        <div class="form-group">
          <label><i class="fas fa-hashtag"></i> 订阅主题</label>
          <input type="text" id="subscribeTopic" value="news.sports">
        </div>
        <div class="form-group">
          <label><i class="fas fa-id-card"></i> 订阅者ID</label>
          <input type="text" id="subscriberId" placeholder="(可选)">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="replayHistory" checked>
            <i class="fas fa-history"></i> 接收历史消息
          </label>
        </div>
        <button id="subscribeBtn" class="secondary"><i class="fas fa-plus-circle"></i> 创建订阅者</button>
        <h3><i class="fas fa-chart-bar"></i> 主题状态</h3>
        <div class="topic-status">
          <div class="metric-box">
            <div class="metric-value" id="subscriberCount">0</div>
            <div class="metric-label">订阅者</div>
          </div>
          <div class="metric-box">
            <div class="metric-value" id="pendingMessages">0</div>
            <div class="metric-label">待处理消息</div>
          </div>
        </div>
        <h3><i class="fas fa-clipboard-list"></i> 订阅日志</h3>
        <div class="logs" id="subscribeLog"></div>
      </div>
    </div>

    <!-- 系统日志 -->
    <div class="card system-log">
      <div class="card-header">
        <h2><i class="fas fa-terminal"></i> 系统日志</h2>
      </div>
      <div class="logs" id="systemLog"></div>
    </div>

    <!-- 页脚 -->
    <footer>
      <p>高级消息中间件系统 v2.0 | 技术支持：消息系统实验室</p>
      <p>© 2023 消息处理引擎 | 遵循 MIT 开源协议</p>
    </footer>
  </div>

  <script src="pubsub.js"></script>
  <script>
    // 初始化PubSub实例
    const pubsub = new PubSub();

    // DOM元素引用
    const publishBtn = document.getElementById('publishBtn');
    const publishNoSubBtn = document.getElementById('publishNoSubBtn');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const broadcastMode = document.getElementById('broadcastMode');

    // 广播模式切换
    broadcastMode.addEventListener('change', () => {
      document.getElementById('maxConsumptionGroup').style.display =
        broadcastMode.value === 'limited' ? 'block' : 'none';
    });

    // 发布消息
    publishBtn.addEventListener('click', () => {
      const topic = document.getElementById('publishTopic').value;
      const message = document.getElementById('messageContent').value;
      const options = {
        broadcastMode: broadcastMode.value,
        maxConsumption: broadcastMode.value === 'limited'
          ? parseInt(document.getElementById('maxConsumption').value)
          : null,
        historySize: 5,
        timeout: 15000
      };

      pubsub.publish(topic, message, options, (ackInfo) => {
        let logEntry = document.createElement('div');
        logEntry.className = 'log-entry ' + (ackInfo.status === 'timeout' ? 'warning' : 'ack');
        logEntry.innerHTML = `
                    <span class="log-time">${new Date().toLocaleTimeString()}</span>
                    ${ackInfo.status === 'timeout' ? '⏰ 超时' : '✅ 已消费'} 
                    ${ackInfo.message.substring(0, 30)}...
                    <small>${ackInfo.subscriberId || ''}</small>
                `;
        document.getElementById('publishLog').appendChild(logEntry);
      });
    });

    // 创建订阅者
    subscribeBtn.addEventListener('click', () => {
      const topic = document.getElementById('subscribeTopic').value;
      const subscriberId = document.getElementById('subscriberId').value || undefined;

      const subscriptionId = pubsub.subscribe(topic, (message, ack, meta) => {
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry ' + (meta.isHistory ? 'history' : 'realtime');
        logEntry.innerHTML = `
                    <span class="log-time">${new Date().toLocaleTimeString()}</span>
                    ${meta.isHistory ? '🕰️ 历史' : '⚡ 实时'}消息: 
                    ${message.substring(0, 30)}...
                `;
        document.getElementById('subscribeLog').appendChild(logEntry);
        ack('已确认');
      }, {
        subscriberId,
        replayHistory: document.getElementById('replayHistory').checked
      });

      updateStatus();
    });

    // 更新状态显示
    function updateStatus () {
      const topic = document.getElementById('publishTopic').value;
      const info = pubsub.getTopicInfo(topic) || { subscribers: 0, pendingMessages: 0 };
      document.getElementById('subscriberCount').textContent = info.subscribers;
      document.getElementById('pendingMessages').textContent = info.pendingMessages;
    }

    // 系统日志记录
    function logSystem (message) {
      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry system';
      logEntry.innerHTML = `
                <span class="log-time">${new Date().toLocaleTimeString()}</span>
                ${message}
            `;
      document.getElementById('systemLog').appendChild(logEntry);
    }

    // 初始化日志
    logSystem('系统初始化完成，PubSub引擎已启动');
    setInterval(updateStatus, 1000);
  </script>
</body>

</html>
